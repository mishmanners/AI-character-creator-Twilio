<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Gallery - AI Generated Images</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Image Gallery</h1>
        <p>Check out these images generated from your colleagues and friends here at NDC Copenhagen</p>
    </div>
    
    <div class="carousel-container">
        <div id="loading" class="loading">
            <p>Loading images...</p>
        </div>
        
        <div id="no-images" class="no-images" style="display: none;">
            <h3>No images found</h3>
            <p>Send an image to the WhatsApp bot to generate an AI anime-style image.</p>
            <button class="refresh-btn" onclick="loadImages()">Refresh</button>
        </div>
        
        <div id="carousel" class="carousel" style="display: none;">
            <button class="carousel-nav prev" id="prevBtn" onclick="changeImage(-1)">❮</button>
            <div id="flipbook-shell" class="flipbook-shell">
                <div id="flipbook" class="flipbook" aria-label="Generated image flipbook"></div>
            </div>
            <button class="carousel-nav next" id="nextBtn" onclick="changeImage(1)">❯</button>
        </div>
        
        <div id="carousel-info" class="carousel-info" style="display: none;">
            <div id="dots-container" class="dots-container" style="display: none;"></div>
        </div>
        
        
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <script>
        let images = [];
        let currentPage = 1;
        let autoAdvanceInterval = null;
        let resumeTimeout = null;
        let isTurnInitialized = false;
        let isHoveringGallery = false;
        let resizeTimeout = null;
        let imageStream = null;
        let imageStreamRetryTimeout = null;
        let isLoadingImages = false;
        let pendingLoadImages = false;
        let isProgrammaticRebuild = false;
        let rebuildSafetyTimeout = null;

        function getTotalPages() {
            return images.length;
        }

        function getFlipbookElement() {
            return window.jQuery ? window.jQuery('#flipbook') : null;
        }

        function isDoubleDisplayActive() {
            if (!isTurnInitialized) return !window.matchMedia('(max-width: 900px)').matches;
            try {
                return getFlipbookElement().turn('display') === 'double';
            } catch (_) {
                return !window.matchMedia('(max-width: 900px)').matches;
            }
        }

        function getCurrentViewPages() {
            if (!isTurnInitialized) return [currentPage, currentPage];
            try {
                const view = getFlipbookElement().turn('view') || [currentPage, currentPage];
                const left = Number(view[0]) || 0;
                const right = Number(view[1]) || left;
                return [left, right];
            } catch (_) {
                return [currentPage, currentPage];
            }
        }

        function getNextSpreadPage() {
            const totalPages = getTotalPages();
            if (!totalPages) return 1;

            if (!isDoubleDisplayActive()) {
                return currentPage < totalPages ? currentPage + 1 : 1;
            }

            const [, right] = getCurrentViewPages();
            const next = right + 1;
            return next <= totalPages ? next : 1;
        }

        function getPreviousSpreadPage() {
            const totalPages = getTotalPages();
            if (!totalPages) return 1;

            if (!isDoubleDisplayActive()) {
                return currentPage > 1 ? currentPage - 1 : totalPages;
            }

            const [left] = getCurrentViewPages();
            if (left <= 1) return totalPages;

            const prevRight = left - 1;
            return Math.max(1, prevRight - 1);
        }

        function getImageTimestamp(image) {
            const value = image && image.created ? new Date(image.created).getTime() : 0;
            return Number.isFinite(value) ? value : 0;
        }

        function sortImagesChronologically(imageList) {
            return [...imageList].sort((a, b) => getImageTimestamp(a) - getImageTimestamp(b));
        }

        function isFinalGalleryImage(image) {
            const name = String(image?.name || '');
            const url = String(image?.url || '');
            return name.toLowerCase().endsWith('_twilio.png') || url.toLowerCase().endsWith('_twilio.png');
        }

        function areUrlListsEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i += 1) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        function isPrefixList(prefix, full) {
            if (prefix.length > full.length) return false;
            for (let i = 0; i < prefix.length; i += 1) {
                if (prefix[i] !== full[i]) return false;
            }
            return true;
        }

        function clearResumeTimeout() {
            if (resumeTimeout) {
                clearTimeout(resumeTimeout);
                resumeTimeout = null;
            }
        }

        function scheduleAutoAdvanceResume(delayMs = 2500) {
            clearResumeTimeout();
            if (isHoveringGallery) return;
            resumeTimeout = setTimeout(() => {
                startAutoAdvance();
            }, delayMs);
        }

        function getBookDimensions() {
            const shell = document.getElementById('flipbook-shell');
            const carousel = document.getElementById('carousel');
            const galleryContainer = document.querySelector('.carousel-container');
            const isMobile = window.matchMedia('(max-width: 900px)').matches;
            const containerWidth = galleryContainer ? galleryContainer.clientWidth : window.innerWidth;
            const shellWidth = shell ? shell.clientWidth : Math.max(containerWidth - (isMobile ? 56 : 160), 280);
            const shellHeight = shell ? shell.clientHeight : (carousel ? carousel.clientHeight : (isMobile ? 360 : 430));

            const widthBudget = Math.max(Math.min(shellWidth, containerWidth - (isMobile ? 48 : 152)), 260);
            const maxHeight = Math.max(shellHeight - 8, 280);

            let width = Math.min(widthBudget, isMobile ? 430 : 760);
            let height = isMobile ? Math.floor(width * 1.24) : Math.floor(width * 0.75);

            if (height > maxHeight) {
                height = maxHeight;
                width = isMobile ? Math.floor(height / 1.24) : Math.floor(height / 0.75);
            }

            width = Math.max(Math.min(width, widthBudget), 260);
            height = Math.max(Math.min(height, maxHeight), 280);

            return {
                width,
                height,
                display: isMobile ? 'single' : 'double'
            };
        }

        function updateNavButtons() {
            const totalPages = getTotalPages();
            document.getElementById('prevBtn').disabled = totalPages <= 1 || currentPage <= 1;
            document.getElementById('nextBtn').disabled = totalPages <= 1 || currentPage >= totalPages;
        }

        function getDotCount() {
            const totalPages = getTotalPages();
            if (!totalPages) return 0;
            return isDoubleDisplayActive() ? Math.ceil(totalPages / 2) : totalPages;
        }

        function getPageForDot(dotIndex) {
            return isDoubleDisplayActive() ? (dotIndex * 2) + 1 : dotIndex + 1;
        }

        function getActiveDotIndex() {
            if (!getTotalPages()) return 0;
            if (!isDoubleDisplayActive()) return Math.max(0, currentPage - 1);

            const [left, right] = getCurrentViewPages();
            const basePage = left > 0 ? left : right;
            return Math.max(0, Math.floor((Math.max(1, basePage) - 1) / 2));
        }

        function createDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';

            const dotCount = getDotCount();

            Array.from({ length: dotCount }).forEach((_, dotIndex) => {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.onclick = () => {
                    stopAutoAdvance();
                    goToPage(getPageForDot(dotIndex));
                    scheduleAutoAdvanceResume(3000);
                };
                dotsContainer.appendChild(dot);
            });
        }

        function updateDots() {
            const activeIndex = Math.max(0, Math.min(getActiveDotIndex(), getDotCount() - 1));
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === activeIndex);
            });
        }

        function setCurrentPage(page) {
            currentPage = Math.max(1, Math.min(page, getTotalPages() || 1));
            updateNavButtons();
            updateDots();
        }

        function updateBookLayout() {
            if (!isTurnInitialized) return;
            const $flipbook = getFlipbookElement();
            if (!$flipbook) return;

            const { width, height, display } = getBookDimensions();
            $flipbook.turn('display', display);
            $flipbook.turn('size', width, height);
            $flipbook.turn('center');
            createDots();
            updateDots();
        }

        function buildPageElement(imageData, pageIndex) {
            const page = document.createElement('div');
            page.className = 'flip-page';

            const slot = document.createElement('div');
            slot.className = 'spread-slot';

            const img = document.createElement('img');
            img.src = imageData.url;
            img.alt = `Generated cartoon ${pageIndex + 1}`;
            img.loading = 'lazy';
            img.draggable = false;
            img.onerror = () => {
                slot.className = 'spread-empty';
                slot.textContent = 'Image unavailable';
            };

            slot.appendChild(img);
            page.appendChild(slot);
            return page;
        }

        function initFlipbook(pageToOpen = 1) {
            if (!window.jQuery || !window.jQuery.fn || typeof window.jQuery.fn.turn !== 'function') {
                console.error('turn.js failed to load.');
                return;
            }

            const $flipbook = getFlipbookElement();
            if (!$flipbook) return;

            const safePage = Math.max(1, Math.min(pageToOpen, getTotalPages() || 1));

            if (isTurnInitialized) {
                $flipbook.turn('destroy');
                isTurnInitialized = false;
            }

            $flipbook.empty();

            images.forEach((image, index) => {
                $flipbook.append(buildPageElement(image, index));
            });

            const { width, height, display } = getBookDimensions();

            isProgrammaticRebuild = true;
            if (rebuildSafetyTimeout) {
                clearTimeout(rebuildSafetyTimeout);
                rebuildSafetyTimeout = null;
            }

            $flipbook.turn({
                width,
                height,
                display,
                autoCenter: true,
                gradients: true,
                acceleration: true,
                elevation: 70,
                when: {
                    turning: () => {},
                    turned: (_, page) => {
                        setCurrentPage(page);

                        if (isProgrammaticRebuild) {
                            isProgrammaticRebuild = false;
                            if (!isHoveringGallery) {
                                startAutoAdvance();
                            }
                            return;
                        }

                        if (!isHoveringGallery) {
                            scheduleAutoAdvanceResume(2500);
                        }
                    }
                }
            });

            isTurnInitialized = true;
            $flipbook.turn('page', safePage);
            setCurrentPage(safePage);
            createDots();
            updateDots();
            updateNavButtons();

            // Ensure programmatic rebuilds cannot leave autoplay paused if turn.js skips events.
            rebuildSafetyTimeout = setTimeout(() => {
                if (isProgrammaticRebuild) {
                    isProgrammaticRebuild = false;
                    if (!isHoveringGallery) {
                        startAutoAdvance();
                    }
                }
            }, 450);

            if (!isHoveringGallery) {
                setTimeout(startAutoAdvance, 120);
            }
        }

        function goToPage(page) {
            const totalPages = getTotalPages();
            if (!isTurnInitialized || totalPages === 0) return;
            const targetPage = Math.max(1, Math.min(page, totalPages));
            getFlipbookElement().turn('page', targetPage);
        }

        function appendPagesToFlipbook(appendedImages) {
            if (!isTurnInitialized || !appendedImages.length) return false;

            const $flipbook = getFlipbookElement();
            if (!$flipbook) return false;

            try {
                let pageNumber = $flipbook.turn('pages') + 1;

                appendedImages.forEach((image, idx) => {
                    const pageElement = buildPageElement(image, pageNumber + idx - 1);
                    $flipbook.turn('addPage', pageElement, pageNumber + idx);
                });

                createDots();
                updateDots();
                updateNavButtons();
                return true;
            } catch (error) {
                console.error('Failed to append pages directly, falling back to rebuild:', error);
                return false;
            }
        }
        
        async function loadImages() {
            if (isLoadingImages) {
                pendingLoadImages = true;
                return;
            }

            isLoadingImages = true;
            try {
                const response = await fetch(`/api/images?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed image request with status ${response.status}`);
                }

                const newImages = await response.json();
                const finalImages = Array.isArray(newImages) ? newImages.filter(isFinalGalleryImage) : [];
                
                document.getElementById('loading').style.display = 'none';
                
                if (finalImages.length === 0) {
                    if (images.length === 0) {
                        document.getElementById('no-images').style.display = 'block';
                    }
                } else {
                    const incomingImages = sortImagesChronologically(finalImages);
                    const previousUrls = images.map((img) => img.url);
                    const incomingUrls = incomingImages.map((img) => img.url);
                    const isAppendOnly = isPrefixList(previousUrls, incomingUrls) && incomingUrls.length > previousUrls.length;
                    const appendedImages = isAppendOnly ? incomingImages.slice(previousUrls.length) : [];
                    const pageBeforeReload = currentPage;

                    images = incomingImages;
                    
                    if (images.length > 0) {
                        document.getElementById('no-images').style.display = 'none';
                        document.getElementById('carousel').style.display = 'flex';
                        document.getElementById('carousel-info').style.display = 'block';
                        document.getElementById('dots-container').style.display = 'block';

                        if (!isTurnInitialized) {
                            initFlipbook(pageBeforeReload);
                        } else if (isAppendOnly && appendedImages.length > 0) {
                            const appended = appendPagesToFlipbook(appendedImages);
                            if (!appended) {
                                initFlipbook(pageBeforeReload);
                            }
                        } else if (!areUrlListsEqual(previousUrls, incomingUrls)) {
                            initFlipbook(pageBeforeReload);
                        } else {
                            goToPage(pageBeforeReload);
                            setCurrentPage(pageBeforeReload);
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to load images:', error);
                if (images.length === 0) {
                    document.getElementById('loading').innerHTML = '<p>Failed to load images. Please refresh the page.</p>';
                }
            } finally {
                isLoadingImages = false;
                if (pendingLoadImages) {
                    pendingLoadImages = false;
                    loadImages();
                }
            }
        }

        function initImageLiveStream() {
            if (!window.EventSource) {
                return;
            }

            if (imageStream) {
                imageStream.close();
            }

            if (rebuildSafetyTimeout) {
                clearTimeout(rebuildSafetyTimeout);
                rebuildSafetyTimeout = null;
            }

            imageStream = new EventSource('/api/images/stream');

            imageStream.addEventListener('images_update', () => {
                loadImages();
            });

            imageStream.onerror = () => {
                if (imageStream) {
                    imageStream.close();
                    imageStream = null;
                }

                if (imageStreamRetryTimeout) {
                    clearTimeout(imageStreamRetryTimeout);
                }

                imageStreamRetryTimeout = setTimeout(() => {
                    initImageLiveStream();
                }, 3000);
            };
        }
        
        function startAutoAdvance() {
            if (autoAdvanceInterval) {
                clearInterval(autoAdvanceInterval);
            }
            
            if (isTurnInitialized && getTotalPages() > 1) {
                autoAdvanceInterval = setInterval(() => {
                    goToPage(getNextSpreadPage());
                }, 5000);
            }
        }
        
        function stopAutoAdvance() {
            if (autoAdvanceInterval) {
                clearInterval(autoAdvanceInterval);
                autoAdvanceInterval = null;
            }
            clearResumeTimeout();
        }
        
        function changeImage(direction) {
            stopAutoAdvance();
            if (direction > 0) {
                goToPage(getNextSpreadPage());
            } else {
                goToPage(getPreviousSpreadPage());
            }
            scheduleAutoAdvanceResume(3000);
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            const carouselContainer = document.querySelector('.carousel-container');
            if (carouselContainer) {
                carouselContainer.addEventListener('mouseenter', () => {
                    isHoveringGallery = true;
                    stopAutoAdvance();
                });

                carouselContainer.addEventListener('mouseleave', () => {
                    isHoveringGallery = false;
                    startAutoAdvance();
                });
            }

            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(updateBookLayout, 160);
            });

            initImageLiveStream();
        });
        
        setInterval(loadImages, 15000);
        
        loadImages();
    </script>
</body>
</html>
