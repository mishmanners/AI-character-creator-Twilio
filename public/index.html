<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Gallery - AI Generated Images</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .carousel-container {
            padding: 10px;
        }
        
        .carousel {
            padding: 10px;
        }
        
        #currentImage {
            padding: 10px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Image Gallery</h1>
        <p>Check out these images generated from your colleagues and friends</p>
    </div>
    
    <div class="carousel-container">
        <div id="loading" class="loading">
            <p>Loading images...</p>
        </div>
        
        <div id="no-images" class="no-images" style="display: none;">
            <h3>No images found</h3>
            <p>Send an image to the WhatsApp bot to generate an AI artwork image.</p>
            <button class="refresh-btn" onclick="loadImages()">Refresh</button>
        </div>
        
        <div id="carousel" class="carousel" style="display: none;">
            <button class="carousel-nav prev" id="prevBtn" onclick="changeImage(-1)">❮</button>
            <img id="currentImage" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Generated artwork" onerror="this.style.display='none'" />
            <button class="carousel-nav next" id="nextBtn" onclick="changeImage(1)">❯</button>
        </div>
        
        <div id="carousel-info" class="carousel-info" style="display: none;">
            <div class="image-counter" id="imageCounter"></div>
            <div class="image-date" id="imageDate"></div>
        </div>
        
        <div id="dots-container" class="dots-container" style="display: none;"></div>
    </div>
    
    <script>
        let images = [];
        let currentIndex = 0;
        let autoAdvanceInterval = null;
        
        async function loadImages() {
            try {
                const response = await fetch('/api/images');
                const newImages = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                
                if (newImages.length === 0) {
                    if (images.length === 0) {
                        document.getElementById('no-images').style.display = 'block';
                    }
                } else {
                    // Check if there are new images to add
                    const existingUrls = images.map(img => img.url);
                    const imagesToAdd = newImages.filter(img => !existingUrls.includes(img.url));
                    
                    if (imagesToAdd.length > 0) {
                        // Append new images to existing array
                        images = [...images, ...imagesToAdd];
                        
                        // Update dots for new images~
                        createDots();
                    } else if (images.length === 0) {
                        // First time loading
                        images = newImages;
                    }
                    
                    if (images.length > 0) {
                        document.getElementById('no-images').style.display = 'none';
                        document.getElementById('carousel').style.display = 'flex';
                        document.getElementById('dots-container').style.display = 'block';
                        
                        // If this is first time setup or no current image, setup carousel
                        if (currentIndex >= images.length || !document.getElementById('currentImage').src.includes('http')) {
                            setupCarousel();
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to load images:', error);
                if (images.length === 0) {
                    document.getElementById('loading').innerHTML = '<p>Failed to load images. Please refresh the page.</p>';
                }
            }
        }
        
        function setupCarousel() {
            if (images.length > 0) {
                currentIndex = 0;
                createDots();
                showImage(0);
                startAutoAdvance();
            }
        }
        
        function startAutoAdvance() {
            // Clear any existing interval
            if (autoAdvanceInterval) {
                clearInterval(autoAdvanceInterval);
            }
            
            // Only start auto-advance if there are multiple images
            if (images.length > 1) {
                autoAdvanceInterval = setInterval(() => {
                    const nextIndex = currentIndex + 1;
                    if (nextIndex < images.length) {
                        showImage(nextIndex);
                    } else {
                        // Go back to start only when we reach the end
                        showImage(0);
                    }
                }, 5000); // 5 seconds
            }
        }
        
        function stopAutoAdvance() {
            if (autoAdvanceInterval) {
                clearInterval(autoAdvanceInterval);
                autoAdvanceInterval = null;
            }
        }
        
        function createDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';
            
            images.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = 'dot';
                dot.onclick = () => {
                    // Stop using auto-advance when user clicks dot
                    stopAutoAdvance();
                    showImage(index);
                    // Restart auto-advance after manual interaction
                    setTimeout(startAutoAdvance, 3000); // Wait 3 seconds before resuming
                };
                dotsContainer.appendChild(dot);
            });
        }
        
        function showImage(index) {
            if (images.length === 0 || index < 0 || index >= images.length) return;
            
            currentIndex = index;
            const image = images[currentIndex];
            
            // Ensure image object exists
            if (!image || !image.url) {
                console.error('Invalid image data at index:', index);
                return;
            }
            
            const imgElement = document.getElementById('currentImage');
            imgElement.style.display = 'block';
            imgElement.src = image.url;
            
            document.getElementById('imageCounter').textContent = `${currentIndex + 1} of ${images.length}`;
            if (image.created) {
                document.getElementById('imageDate').textContent = new Date(image.created).toLocaleString();
            }
            
            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === images.length - 1;
            
            // Update dots
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }
        
        function changeImage(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < images.length) {
                // Stop auto-advance when user manually navigates
                stopAutoAdvance();
                showImage(newIndex);
                // Restart auto-advance after manual interaction
                setTimeout(startAutoAdvance, 3000); // Wait 3 seconds before resuming
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
        });
        
        // Pause auto-advance on hover, resume on mouse leave
        document.addEventListener('DOMContentLoaded', () => {
            const carouselContainer = document.querySelector('.carousel-container');
            if (carouselContainer) {
                carouselContainer.addEventListener('mouseenter', stopAutoAdvance);
                carouselContainer.addEventListener('mouseleave', startAutoAdvance);
            }
        });
        
        // Auto-refresh every 30 seconds
        setInterval(loadImages, 30000);
        
        // Load images on page load
        loadImages();
    </script>
</body>
</html>
